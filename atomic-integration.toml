schema = 1
agent = "kilo"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

[skills-source]
package = "atomic-skills"

[skills]
install = "all"
dst_pattern = "~/.config/kilo/skills/{name}/SKILL.md"

[[skill]]
src = "AGENTS.md"
dst = "~/.config/kilo/AGENTS.md"

[[skill]]
src = "AGENTS.md"
dst = "~/.config/kilo/rules/atomic.md"

[[repo-file]]
src = "AGENTS.md"
dst = "AGENTS.md"

[agent-definition]
src = "agents/atomic.md.frontmatter"
body_from = "atomic-skills:AGENTS.md"
slot = "~/.config/kilo/agent/atomic.md"

[[file]]
src = "plugins/atomic-hooks.ts"
dst = "~/.config/kilo/plugin/atomic-hooks.ts"

[[file]]
src = "package.json"
dst = "~/.config/kilo/package.json"
