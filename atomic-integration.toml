schema = 1
agent = "kilo"
version = "1.0.0"

[requires]
atomic = ">=0.11.0"

[[file]]
src = "rules/atomic.md"
dst = "~/.config/kilo/rules/atomic.md"

[[file]]
src = "agents/atomic.md"
dst = "~/.config/kilo/agent/atomic.md"

[[file]]
src = "AGENTS.md"
dst = "~/.config/kilo/AGENTS.md"

[[file]]
src = "plugins/atomic-hooks.ts"
dst = "~/.config/kilo/plugin/atomic-hooks.ts"

[[file]]
src = "package.json"
dst = "~/.config/kilo/package.json"
